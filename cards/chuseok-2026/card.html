<!doctype html>
<!-- MFH-CARD-CHUSEOK-2026-V3 · 상단 로고·달 제거 · 추석 메시지 카드 · 1080×1920 · ?v=cream | ?v=navy -->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>추석 메시지 카드 2026 · MFH</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --maroon:#661F20; --red:#B61821; --gold:#D9A441; --gold-d:#B88A3E;
    --navy:#1F3A5F; --navy-d:#14273F; --brown:#8A5A2B; --ink:#3B2F2A; --sub:#7A6A60;
    --cream:#FBF7EF; --cream-d:#F1E9DA;
    --brush:"Nanum Brush Script",cursive;
    --serif:"Noto Serif KR","Nanum Myeongjo",serif;
    --sans:"Montserrat","Pretendard",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#cbc7c2;}
  body{display:flex;justify-content:center;padding:24px 0 50px;-webkit-font-smoothing:antialiased;}

  .card{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--cream);
    font-family:var(--sans);color:var(--ink);print-color-adjust:exact;-webkit-print-color-adjust:exact;}

  /* 사진: 상단 1300px, 아래쪽 기준 크롭(엄마 얼굴 보존) */
  .photo{position:absolute;left:0;top:0;width:1080px;height:1300px;overflow:hidden;}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 78%;display:block;}
  .photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;
    background:linear-gradient(to bottom,rgba(251,247,239,0),var(--cream));}

  /* 사진 위 상단 라벨 */
  .moon{position:absolute;right:60px;top:52px;width:236px;height:236px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#FFE79A,#F5C443 68%,#E6AB2E);
    box-shadow:0 0 0 16px rgba(245,196,67,.16),0 0 70px rgba(245,196,67,.6);}
  .hanja{position:absolute;right:60px;top:52px;width:236px;height:236px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;
    font-size:76px;letter-spacing:.12em;text-indent:.12em;color:var(--navy-d);}
  .hanja small{display:block;font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:.3em;
    text-indent:.3em;margin-top:2px;color:var(--brown);}
  .logo{position:absolute;left:56px;top:58px;height:46px;padding:9px 14px;box-sizing:content-box;
    background:rgba(255,255,255,.72);border-radius:14px;backdrop-filter:blur(4px);}

  /* 텍스트 존 */
  .msg{position:absolute;left:0;right:0;top:1300px;bottom:0;display:flex;flex-direction:column;
    align-items:center;text-align:center;padding-top:14px;}


  .greet{position:relative;font-family:var(--brush);line-height:.98;letter-spacing:.01em;}
  .greet .l1{font-size:150px;color:var(--brown);}
  .greet .l2{font-size:126px;color:var(--navy);margin-top:-8px;}
  .greet .l2 em{font-style:normal;color:var(--red);}

  .verse{margin-top:28px;font-family:var(--serif);font-weight:500;font-size:31px;line-height:1.55;color:var(--ink);}
  .verse .ref{display:block;margin-top:8px;font-family:var(--sans);font-weight:600;font-size:20px;
    letter-spacing:.08em;color:var(--sub);}

  .rule{width:56px;height:3px;border-radius:2px;background:var(--gold);margin:30px 0 24px;}

  .from{font-family:var(--serif);font-weight:700;font-size:30px;color:var(--maroon);letter-spacing:.02em;}
  .from small{display:block;margin-top:8px;font-family:var(--sans);font-weight:600;font-size:18px;
    letter-spacing:.2em;color:var(--sub);}

  /* 별 장식 — 사진 속 손 별과 호응 */
  .stars{position:absolute;inset:0;pointer-events:none;}
  .stars i{position:absolute;width:12px;height:12px;background:var(--gold);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:.8;}

  /* ── navy 변주 ── */
  .card.navy{background:var(--navy-d);color:#EDE6D8;}
  .card.navy .photo::after{height:300px;background:linear-gradient(to bottom,rgba(20,39,63,0),rgba(20,39,63,.55) 55%,var(--navy-d));}
  .card.navy .greet .l1{color:#F2C766;}
  .card.navy .greet .l2{color:#FBF7EF;}
  .card.navy .greet .l2 em{color:#F08A7E;}
  .card.navy .verse{color:#EDE6D8;}
  .card.navy .verse .ref{color:#A9B7CC;}
  .card.navy .from{color:#F2C766;}
  .card.navy .from small{color:#A9B7CC;}
  .card.navy .stars i{background:#F2C766;}

  @media print{html,body{background:#fff;}body{padding:0;}@page{size:1080px 1920px;margin:0;}}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="photo"><img src="./photo.jpg" alt="" /></div>

    <div class="msg">
      <div class="greet">
        <div class="l1">복되고 행복한</div>
        <div class="l2">추석<em>명절</em> 되세요</div>
      </div>
      <div class="verse">범사에 감사하라 이것이 그리스도 예수 안에서<br/>너희를 향하신 하나님의 뜻이니라
        <span class="ref">데살로니가전서 5:18</span></div>
      <div class="rule"></div>
      <div class="from">온두라스에서 김우진 · 서진아 선교사 가정 드림
        <small>MISSION FOR HONDURAS</small></div>
    </div>

    <div class="stars">
      <i style="left:120px;top:1395px"></i>
      <i style="left:930px;top:1470px;transform:scale(.7)"></i>
      <i style="left:190px;top:1640px;transform:scale(.6)"></i>
      <i style="left:880px;top:1700px"></i>
    </div>
  </div>
<script>
  if(new URLSearchParams(location.search).get('v')==='navy'){document.getElementById('card').classList.add('navy');}
</script>
</body>
</html>
